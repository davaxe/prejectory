[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prejectory"
version = "0.0.0"
description = "Trajectory data processing toolkit for autonomous driving datasets"
authors = [
    { name = "Theodor Westny", email = "theodor.westny@liu.se" },
    { name = "David Axelsson", email = "david.axelsson@liu.se" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24.0",
    "polars>=1.0.0",
    "scipy>=1.10.0",
    "typing-extensions>=4.15.0",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
]

keywords = ["autonomous driving", "trajectory data", "data processing", "datasets", "machine learning"]

classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/davaxe/prejectory"
Repository = "https://github.com/davaxe/prejectory"
Documentation = "https://davaxe.github.io/prejectory/"
Issues = "https://github.com/davaxe/prejectory/issues"

[project.scripts]
prejectory = "prejectory.__main__:main"

[project.optional-dependencies]
# viz = ["prejectory-viz"]
waymo = ["protobuf>=4.25.8"]
ad4che = ["opencv-python"]
mds = ["mosaicml-streaming>=0.13.0"]
zarr = ["zarr>=3.1,<4"]
torch = ["torch>=2.0.0"]
pyg = ["torch>=2.0.0", "torch-geometric>=2.7.0"]
cli = ["typer>=0.24.1"]

[dependency-groups]
test = [
    "coverage>=7.13.5",
    "pytest>=7.0",
]

lint = [
    "ruff>=0.11",
]

typecheck = [
    "basedpyright>=1.0.0",
    "scipy-stubs",
]

build = [
    "build>=1.2.2",
    "twine>=6.2.0",
]

docs = [
    "mkdocstrings[python]>=1.0.3",
    "zensical>=0.0.30",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "build" },
    { include-group = "docs" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/prejectory"]

[tool.hatch.build.targets.sdist]
exclude = ["tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "-q"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "dataset(name): marks tests that require a specific dataset (deselect with '-m \"not dataset\"')",
]
filterwarnings = [
    "ignore:.*torch_geometric\\.distributed.*:DeprecationWarning",
    "ignore:.*torch\\.jit\\.script.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
omit = [
    "src/prejectory/datasets/*/protos/*.py",
]

[tool.ty.src]
exclude =  ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "protos/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
# Exclude proto compiled files from linting and formatting
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi", "protos/*"]
line-length = 100
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "multi-line-summary-second-line",
    "missing-trailing-comma",
    "magic-value-comparison",
    "docstring-missing-returns",
    "docstring-missing-exception",
    "undocumented-public-module",
    "missing-todo-author",
    "missing-todo-link",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "docstring-missing-yields",
    "missing-copyright-notice",
    "undocumented-public-package",
    "missing-todo-description",
    "undocumented-public-class",
]
pydocstyle = { convention = "numpy" }

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "implicit-namespace-package", "assert", "import-private-name"]
"examples/**/*.py" = ["D", "implicit-namespace-package", "assert", "import-private-name", "print"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.basedpyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "recommended"
include = ["src", "tests"]
exclude = [
    "protos",
    "**/protos",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "**/*_pb2_grpc.py",
]
ignore = [
    "protos",
    "**/protos",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
    "**/*_pb2_grpc.py",
]
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportUnknownMemberType = false

# [tool.uv.sources]
# prejectory-viz = { path = "../prejectory-viz", editable = true }
